# CI on every push / pull request; a GitHub Release when a version tag is pushed.
#
# To publish a release:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The release gets coregui.exe (Windows), coregui-linux-amd64 and SHA256SUMS.txt,
# built here from the tagged source, so anyone can check what they download.

name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...

      - name: Build
        run: |
          VERSION="dev"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w -X main.appVersion=$VERSION" -o dist/coregui.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.appVersion=$VERSION" -o dist/coregui-linux-amd64 .
          cd dist && sha256sum coregui.exe coregui-linux-amd64 > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: coregui
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "CoreGUI $GITHUB_REF_NAME" --notes-file .github/release-notes.md
